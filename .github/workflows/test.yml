name: Java Testing

on:
  push:
    branches: [ "dev2", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Unit Tests
      # Perintah ini khusus untuk menjalankan testing
      run: mvn -B test --file pom.xml