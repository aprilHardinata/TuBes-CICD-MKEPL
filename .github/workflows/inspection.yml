name: Code Inspection

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven
        
    - name: Run PMD Analysis
      # Melakukan inspeksi kualitas kode (Code Quality) menggunakan PMD
      run: mvn -B pmd:pmd pmd:check -Dpmd.printFailingErrors=true --file pom.xml

    - name: Run Checkstyle
      # Melakukan pengecekan format kode menggunakan Checkstyle
      run: mvn -B checkstyle:check --file pom.xml || true
