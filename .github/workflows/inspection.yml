name: Code Inspection

on:
  push:
    branches: [ "dev", "main", "master" ]
  pull_request:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven

    - name: Compile sources
      run: mvn -B compile test-compile --file pom.xml

    - name: Run PMD analysis
      run: mvn -B pmd:pmd pmd:check -Dpmd.printFailingErrors=true --file pom.xml
      continue-on-error: true

    - name: Run Checkstyle analysis
      run: mvn -B checkstyle:checkstyle checkstyle:check --file pom.xml
      continue-on-error: true

    - name: Upload inspection reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: inspection-reports-${{ github.sha }}
        path: |
          target/pmd.xml
          target/checkstyle-result.xml
        if-no-files-found: warn
        retention-days: 7
