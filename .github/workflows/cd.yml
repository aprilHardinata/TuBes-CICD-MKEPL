name: Continuous Delivery (CD)

on:
  push:
    branches: [ "dev2", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven

    - name: Build application (packaging)
      run: mvn -B package -DskipTests --file pom.xml

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Tubes-DPBO
        path: target/tubes-dpbo-kel4-*.jar
        if-no-files-found: error
        retention-days: 14